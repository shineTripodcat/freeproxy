name: update proxies.json

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update Proxies
        run: python scripts/update_proxies.py

      - name: Filter ChatGPT Proxies
        run: python scripts/filter_chatgpt_proxies.py --timeout 6 --max-workers 60

      - name: Commit Changes If Any
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxies.json outputs/chatgpt_http_proxies.txt outputs/chatgpt_socks5_proxies.txt outputs/chatgpt_all_proxies.txt outputs/chatgpt_proxy_test_results.json
          if git diff --cached --quiet; then
            echo "No changes in proxies.json or filtered outputs"
            exit 0
          fi
          git commit -m "Update proxies and ChatGPT filtered outputs [skip ci]"
          git push
